[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contact3d"
version = "0.1.0"
description = "Research implementation of 3D finite-sliding mortar contact"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
sparse = ["scipy>=1.14"]
dev = ["pytest>=8.0", "ruff>=0.12", "scipy>=1.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/contact3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
