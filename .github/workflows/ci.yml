name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # This repository is public. A pull_request from a fork must never reach
  # the self-hosted runner below -- `test` needs this job and fails
  # outright (not a silent skip) if the PR's head repository isn't this
  # same repository, i.e. isn't from someone with write access.
  guard-self-hosted:
    name: Verify trusted source for self-hosted jobs
    runs-on: ubuntu-latest
    steps:
      - name: Reject pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Self-hosted runner jobs do not run for pull requests from forks (head repository: ${{ github.event.pull_request.head.repo.full_name }})."
          exit 1

  test:
    name: Lint and test (Python 3.12)
    needs: guard-self-hosted
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Sync dependencies
        run: uv sync --extra dev --python 3.12

      - name: Ruff check
        run: uv run ruff check .

      - name: Run test suite
        run: uv run pytest -q
